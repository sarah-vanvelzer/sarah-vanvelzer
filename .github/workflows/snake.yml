name: collage snake

on:
  schedule:
    - cron: "0 5 * * *"   # redraws once a day
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: draw the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1f1f1f&color_dots=#ece7dc,#f2a7c6,#e8782a,#d6247d,#3b4fa0
            dist/snake-dark.svg?color_snake=#f2e9d8&color_dots=#2a2a2a,#7a1f4a,#e8782a,#d6247d,#7fb8bd

      - name: save it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
